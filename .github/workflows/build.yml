name: Build

on:
  workflow_dispatch:
    inputs:
      build_editor:
        description: Build the macOS editor
        type: boolean
        default: true
      build_templates:
        description: Build the web export templates
        type: boolean
        default: true

env:
  BUILD_NAME: web_export

# Builds only the macOS editor + managed assemblies/NuGet packages.
# Web export templates (wasm) are platform-independent — reuse the zips from
# the official release built from the same submodule commit.
jobs:
  build-macos-editor:
    if: ${{ inputs.build_editor }}
    runs-on: macos-latest

    env:
      SCONS_FLAGS: >-
        optimize=speed
        ccflags="-DNDEBUG"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
          submodules: recursive

      - name: Set Up Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.x

      - name: Set Up SCons
        run: pip install scons

      - name: Set Up Vulkan SDK
        run: sh godot/misc/scripts/install_vulkan_sdk_macos.sh

      - name: Set Up .NET 9 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 9.0.x

      - name: Build Editor (macOS)
        run: scons -C godot platform=macos arch=arm64 target=editor module_mono_enabled=yes ${{ env.SCONS_FLAGS }}

      - name: Generate Mono Glue
        run: godot/bin/godot.macos.editor.arm64.mono --headless --quit --generate-mono-glue godot/modules/mono/glue

      - name: Build Mono Assemblies
        run: python godot/modules/mono/build_scripts/build_assemblies.py --godot-output-dir=godot/bin --push-nupkgs-local godot/bin/nuget

      - name: Save Version Text File
        run: |
          godot/bin/godot.macos.editor.arm64.mono --headless --quit --version > godot/bin/version.txt
          cat godot/bin/version.txt

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: godot.macos.mono.${{ env.BUILD_NAME }}.editor
          path: |
            godot/bin/godot.macos.editor.arm64.mono
            godot/bin/version.txt
            godot/bin/GodotSharp/**
            godot/bin/nuget/**

  # Upstream Godot CI pins emsdk 4.0.11 for this engine commit; the 6.x
  # templates from the 4.7.1 release corrupt WebGL uploads (resizable
  # ArrayBuffer views) and the release js/wasm pair fails to instantiate.
  # No glue/assembly steps here: the editor job produces those.
  build-web-template:
    if: ${{ inputs.build_templates }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        target: [template_release, template_debug]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
          submodules: recursive

      - name: Set Up Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.x

      - name: Set Up SCons
        run: pip install scons

      - name: Set Up WASM Tools
        shell: bash
        run: |
          # Install wasm-tools for both 10.0 and 9.0 SDKs
          mv global.json global.json.disabled
          dotnet workload install wasm-tools

          mv global.json.disabled global.json
          dotnet workload install wasm-tools

      - name: Set Up Emscripten SDK
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 4.0.11

      - name: Build Web Template
        run: scons -C godot platform=web target=${{ matrix.target }} module_mono_enabled=yes optimize=speed ccflags="-DNDEBUG"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: godot.web.${{ matrix.target }}.wasm32.mono
          path: godot/bin/godot.web.${{ matrix.target }}.wasm32.mono.zip
